version: '3.8'

services:
  # Redis服务
  redis:
    image: redis:7-alpine
    container_name: automdx_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - automdx_network

  # Flask Web应用
  web:
    build: .
    container_name: automdx_web
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./static/output:/app/static/output
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
    depends_on:
      - redis
    networks:
      - automdx_network

  # Celery Worker
  celery_worker:
    build: .
    container_name: automdx_celery
    restart: always
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./static/output:/app/static/output
      - ./logs:/app/logs
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - automdx_network

  # Celery Beat (定时清理任务等)
  celery_beat:
    build: .
    container_name: automdx_beat
    restart: always
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A app.tasks.celery_app beat --loglevel=info
    networks:
      - automdx_network

  # Nginx反向代理 (生产环境推荐使用)
  nginx:
    image: nginx:alpine
    container_name: automdx_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - web
    networks:
      - automdx_network

volumes:
  redis_data:


networks:
  automdx_network:
    driver: bridge
